<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const smooth = t => {t=clamp(t,0,1);return t*t*(3-2*t)};
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x9caf91,0.012);
const camera = new THREE.PerspectiveCamera(54,innerWidth/innerHeight,.08,240);
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.34;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.setAttribute('aria-label','Interactive bamboo water garden. After the water reaches the vase, drag to look and use WASD to move.');
document.body.prepend(renderer.domElement);

function makeEnvironment(){
  const c=document.createElement('canvas');c.width=2048;c.height=1024;const x=c.getContext('2d');
  const sky=x.createLinearGradient(0,0,0,1024);sky.addColorStop(0,'#617d85');sky.addColorStop(.28,'#b1c4b2');sky.addColorStop(.55,'#d5d4b1');sky.addColorStop(.72,'#7d9871');sky.addColorStop(1,'#243f32');x.fillStyle=sky;x.fillRect(0,0,c.width,c.height);
  for(let i=0;i<85;i++){const px=Math.random()*c.width,py=110+Math.random()*390,rx=45+Math.random()*130,ry=12+Math.random()*30;const g=x.createRadialGradient(px,py,2,px,py,rx);g.addColorStop(0,'rgba(255,246,218,0.16)');g.addColorStop(1,'rgba(255,246,218,0)');x.fillStyle=g;x.save();x.translate(px,py);x.scale(1,ry/rx);x.beginPath();x.arc(0,0,rx,0,Math.PI*2);x.fill();x.restore()}
  for(let layer=0;layer<5;layer++){const y=570+layer*70;x.beginPath();x.moveTo(0,1024);x.lineTo(0,y);for(let px=0;px<=c.width;px+=18){const yy=y+Math.sin(px*.004+layer*1.7)*22+Math.sin(px*.013+layer)*10;x.lineTo(px,yy)}x.lineTo(c.width,1024);x.closePath();x.fillStyle=['#718b6b','#587a59','#3d654a','#2b503c','#1d3b30'][layer];x.fill()}
  for(let i=0;i<230;i++){const px=Math.random()*c.width,y=550+Math.random()*260,h=25+Math.random()*120,w=2+Math.random()*8;x.fillStyle=['#2a4a38','#335840','#466747'][i%3];x.fillRect(px,y-h,w,h);x.beginPath();x.ellipse(px+w/2,y-h,w*2.5,h*.33,0,0,Math.PI*2);x.fill()}
  const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.colorSpace=THREE.SRGBColorSpace;t.needsUpdate=true;return t;
}
const environment=makeEnvironment();scene.background=environment;scene.environment=environment;
scene.add(new THREE.HemisphereLight(0xe5f5e9,0x556247,1.9));
const sun=new THREE.DirectionalLight(0xffedcd,3.8);sun.position.set(-8,13,7);sun.castShadow=true;sun.shadow.mapSize.set(3072,3072);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;sun.shadow.bias=-.00018;sun.shadow.normalBias=.018;sun.shadow.radius=6;scene.add(sun);
const fillLight=new THREE.DirectionalLight(0xc2eef4,1.45);fillLight.position.set(7,7,-8);scene.add(fillLight);
const waterRimLight=new THREE.DirectionalLight(0xa7e9f4,1.0);waterRimLight.position.set(5,8,-6);scene.add(waterRimLight);
const warmBounce=new THREE.PointLight(0xd7b786,52,16,2);warmBounce.position.set(-2,3,1);scene.add(warmBounce);
const canopyGlow=new THREE.DirectionalLight(0xfff0cf,1.05);canopyGlow.position.set(4,11,5);scene.add(canopyGlow);
const gardenFill=new THREE.HemisphereLight(0xe9f8f2,0x48553b,.72);scene.add(gardenFill);

function noiseTexture(size,base,colors,count,kind='speckle'){
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,size,size);
  for(let i=0;i<count;i++){const px=Math.random()*size,py=Math.random()*size;x.globalAlpha=.08+Math.random()*.22;x.fillStyle=colors[i%colors.length];if(kind==='line'){x.lineWidth=.4+Math.random()*1.8;x.beginPath();x.moveTo(px,py);x.lineTo(px+(Math.random()-.5)*size*.18,py+(Math.random()-.5)*2);x.strokeStyle=x.fillStyle;x.stroke()}else{x.beginPath();x.ellipse(px,py,1+Math.random()*8,1+Math.random()*5,Math.random()*Math.PI,0,Math.PI*2);x.fill()}}
  x.globalAlpha=1;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
const groundTexture=noiseTexture(1024,'#65764c',['#899369','#3e5d3f','#abb080','#526c42','#c4b889'],9000);groundTexture.repeat.set(9,9);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({map:groundTexture,color:0xb5bf8b,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.035;ground.receiveShadow=true;scene.add(ground);
const bambooTexture=noiseTexture(512,'#829447',['#d0c178','#405b2d','#e1d092','#60743a','#eff0bd'],1900,'line');bambooTexture.repeat.set(2,1.2);
const ceramicTexture=noiseTexture(512,'#e9d7b7',['#fff6e4','#bea889','#d6c09c'],4200);ceramicTexture.repeat.set(2,1);

const bambooOuter=new THREE.MeshStandardMaterial({color:0xffffff,map:bambooTexture,vertexColors:true,roughness:.34,metalness:.025});
const bambooInner=new THREE.MeshStandardMaterial({color:0x7d884c,vertexColors:true,roughness:.48,side:THREE.DoubleSide});
const bambooEdge=new THREE.MeshStandardMaterial({color:0xb8ae70,vertexColors:true,roughness:.38,side:THREE.DoubleSide});

const FUNNEL_U=.565;
const FUNNEL_HALF_U=.034;
const funnelStartU=FUNNEL_U-FUNNEL_HALF_U;
const funnelEndU=FUNNEL_U+FUNNEL_HALF_U;
const funnelX=-2.72,funnelZ=-3.47,funnelRimY=3.42;
const funnelOuterR=1.02,funnelHoleR=.205,funnelDepth=.38,funnelSegments=96;

// The upper run and stone funnel are lifted together by 0.30 units. This gives
// the incoming bamboo a clean lip-over-bowl entry. The lower run begins below
// the drain and descends in a steeper hill so gravity accelerates the stream.
const upperPathPoints=[
 new THREE.Vector3(-5.25,4.87,5.55),
 new THREE.Vector3(-4.82,4.71,4.12),
 new THREE.Vector3(-3.62,4.53,3.22),
 new THREE.Vector3(-2.02,4.34,3.42),
 new THREE.Vector3(-.42,4.13,2.88),
 new THREE.Vector3(.92,3.97,1.92),
 new THREE.Vector3(1.62,3.82,.55),
 new THREE.Vector3(.78,3.69,-.72),
 new THREE.Vector3(-.72,3.62,-1.18),
 new THREE.Vector3(-2.32,3.60,-1.48),
 new THREE.Vector3(-2.72,3.56,-2.82)
];
const lowerPathPoints=[
 new THREE.Vector3(funnelX-1,2.78,funnelZ+0.3),
 new THREE.Vector3(-1.78,2.66,-3.76),
 new THREE.Vector3(-.86,2.43,-4.34),
 new THREE.Vector3(.34,2.18,-4.38),
 new THREE.Vector3(1.53,1.96,-3.77),
 new THREE.Vector3(2.55,1.79,-4.78),
 new THREE.Vector3(2.08,1.70,-6.02),
 new THREE.Vector3(2.98,1.65,-6.88),
 new THREE.Vector3(4.18,1.62,-6.42),
 new THREE.Vector3(4.58,1.60,-5.35),
 new THREE.Vector3(4.82,1.59,-4.78),
 new THREE.Vector3(5.28,1.58,-4.45)
];
const upperRoute=new THREE.CatmullRomCurve3(upperPathPoints,false,'centripetal',.45);
const lowerRoute=new THREE.CatmullRomCurve3(lowerPathPoints,false,'centripetal',.45);
const dropRoute=new THREE.CatmullRomCurve3([
 upperPathPoints[upperPathPoints.length-1],
 new THREE.Vector3(funnelX,funnelRimY-.19,funnelZ),
 new THREE.Vector3(funnelX,funnelRimY-funnelDepth,funnelZ),
 lowerPathPoints[0]
],false,'centripetal',.45);
for(const c of [upperRoute,lowerRoute,dropRoute]){c.arcLengthDivisions=1200;c.updateArcLengths()}
const path={
 getLength(){return upperRoute.getLength()+dropRoute.getLength()+lowerRoute.getLength()},
 getPointAt(u){u=clamp(u,0,1);if(u<=funnelStartU)return upperRoute.getPointAt(u/funnelStartU);if(u<=funnelEndU)return dropRoute.getPointAt((u-funnelStartU)/(funnelEndU-funnelStartU));return lowerRoute.getPointAt((u-funnelEndU)/(1-funnelEndU))},
 getTangentAt(u){u=clamp(u,0,1);if(u<=funnelStartU)return upperRoute.getTangentAt(u/funnelStartU);if(u<=funnelEndU)return dropRoute.getTangentAt((u-funnelStartU)/(funnelEndU-funnelStartU));return lowerRoute.getTangentAt((u-funnelEndU)/(1-funnelEndU))}
};
const pathLength=path.getLength();
function frameAt(u){
  const p=path.getPointAt(clamp(u,0,1));
  const t=path.getTangentAt(clamp(u,0,1)).normalize();
  let side=new THREE.Vector3(-t.z,0,t.x);
  if(side.lengthSq()<1e-6){side.set(1,0,0);side.addScaledVector(t,-side.dot(t));}
  if(side.lengthSq()<1e-8)side.set(0,0,1);else side.normalize();
  const up=new THREE.Vector3().crossVectors(side,t).normalize();
  return {p,t,side,up};
}

// Soft cool bounce lights sit beside the channel to reveal the liquid surface without
// adding fake water geometry or painted highlights. They also graze the bamboo edges.
const waterBounceLights=[];
for(let i=0;i<5;i++){const f=frameAt(.12+i*.17);const light=new THREE.PointLight(i%2===0?0x9eefff:0xc6f3ff,i%2===0?5.2:4.1,2.8,2);light.position.copy(f.p).addScaledVector(f.side,i%2===0?-.48:.48).add(new THREE.Vector3(0,.28,0));light.castShadow=false;scene.add(light);waterBounceLights.push(light)}

// The fluid itself is provided by the imported 3D DFSPH solver below. There is deliberately
// no hand-written particle fallback: if the solver cannot load, the page reports that error.
function crossPos(u,theta,r,baseY=0){
  const f=frameAt(u);
  return f.p.clone()
    .addScaledVector(f.side,r*Math.sin(theta))
    .addScaledVector(f.up,r*(1-Math.cos(theta))+baseY);
}

function makeGrid(positions,colors,uvs,rows,cols,pointFn,colorFn,uvFn){const start=positions.length/3;for(let i=0;i<=rows;i++){const s=i/rows;for(let j=0;j<=cols;j++){const v=j/cols;const p=pointFn(s,v,i,j);positions.push(p.x,p.y,p.z);const c=colorFn(s,v,i,j);colors.push(c.r,c.g,c.b);const uv=uvFn(s,v,i,j);uvs.push(uv.x,uv.y)}}return start}
function appendGridIndices(indices,start,rows,cols,flip=false){for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){const a=start+i*(cols+1)+j,b=a+cols+1,c=a+1,d=b+1;if(flip)indices.push(a,b,c,b,d,c);else indices.push(a,c,b,b,c,d)}}
function addGroupGeometry(positions,colors,uvs,indices,groups){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));g.setIndex(indices);for(const gr of groups)g.addGroup(gr.start,gr.count,gr.material);g.computeVertexNormals();g.computeBoundingSphere();return g}

const troughMeshes=[];
function buildTroughSegment(u0,u1){
  const P=[],C=[],UV=[],I=[],G=[];const rows=22,cols=18,R0=.247,thick=.046;
  // Keep the inner cross-section constant so the physics surface matches the
  // visible bamboo trough; small joint rings provide the visual segment detail.
  const radius=()=>R0;
  let start=I.length,st=makeGrid(P,C,UV,rows,cols,(s,v)=>{const u=u0+(u1-u0)*s,theta=-Math.PI/2+Math.PI*v,r=radius(s);return crossPos(u,theta,r)},(s,v)=>{const theta=-Math.PI/2+Math.PI*v;let k=.88+.06*Math.sin((u0+(u1-u0)*s)*260)+.035*Math.sin(v*48)+Math.random()*.045;const c=new THREE.Color(v<.12||v>.88?0xb8b56e:0x9cab53);c.multiplyScalar(k);return c},(s,v)=>new THREE.Vector2(s*3,v));appendGridIndices(I,st,rows,cols);G.push({start,count:I.length-start,material:0});
  start=I.length;st=makeGrid(P,C,UV,rows,cols,(s,v)=>{const u=u0+(u1-u0)*s,theta=-Math.PI/2+Math.PI*v,r=radius(s)-thick;return crossPos(u,theta,r,thick)},(s,v)=>{const c=new THREE.Color(0x687840);c.multiplyScalar(.87+.05*Math.sin(v*27)+Math.random()*.035);return c},(s,v)=>new THREE.Vector2(s*3,v));appendGridIndices(I,st,rows,cols,true);G.push({start,count:I.length-start,material:1});
  for(const sideSign of [-1,1]){start=I.length;st=makeGrid(P,C,UV,rows,1,(s,v)=>{const theta=sideSign*(Math.PI/2),r=radius(s)-(v*thick);return crossPos(u0+(u1-u0)*s,theta,r,v*thick)},()=>new THREE.Color(0xb1a768),(s,v)=>new THREE.Vector2(s*3,v));appendGridIndices(I,st,rows,1);G.push({start,count:I.length-start,material:2})}
  // Keep every trough length open at both ends. The previous end caps closed each
  // bamboo segment like a tiny bucket, visibly interrupting the water path.
  const mesh=new THREE.Mesh(addGroupGeometry(P,C,UV,I,G),[bambooOuter,bambooInner,bambooEdge]);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);troughMeshes.push(mesh);
}
const sectionCount=Math.ceil(pathLength/1.15);
function intervalsOutsideFunnel(baseCount){
  const breaks=[];
  for(let i=0;i<=baseCount;i++)breaks.push(i/baseCount);
  breaks.push(funnelStartU,funnelEndU);
  breaks.sort((a,b)=>a-b);
  const unique=breaks.filter((v,i)=>i===0||Math.abs(v-breaks[i-1])>1e-7);
  const intervals=[];
  for(let i=0;i<unique.length-1;i++){
    const u0=unique[i],u1=unique[i+1],um=(u0+u1)*.5;
    if(um>funnelStartU&&um<funnelEndU)continue;
    if(u1-u0>1e-5)intervals.push([u0,u1]);
  }
  return intervals;
}
const troughIntervals=intervalsOutsideFunnel(sectionCount);
for(const [u0,u1] of troughIntervals)buildTroughSegment(u0,u1);

// Small open half-hoops make the joints read as real joined bamboo lengths without
// crossing the trough or blocking its flow. The joint spacing follows the route.
const jointMat=new THREE.MeshStandardMaterial({color:0x8b8a4b,roughness:.62,metalness:.015});
function addTroughJoint(u){
  const pts=[];
  for(let j=0;j<=20;j++)pts.push(crossPos(u,-Math.PI/2+Math.PI*j/20,.263));
  const curve=new THREE.CatmullRomCurve3(pts);
  const joint=new THREE.Mesh(new THREE.TubeGeometry(curve,32,.012,7,false),jointMat);
  joint.castShadow=true;joint.receiveShadow=true;scene.add(joint);
}
for(let i=1;i<sectionCount;i++){
  const u=i/sectionCount;
  if(u>funnelStartU-.004&&u<funnelEndU+.004)continue;
  addTroughJoint(u);
}

const woodMat=new THREE.MeshStandardMaterial({color:0x765b3b,roughness:.85});
const stakeMat=new THREE.MeshStandardMaterial({color:0xb4a16b,map:bambooTexture,roughness:.55});
function cylinderBetween(a,b,r1,r2,material,radial=8){const d=new THREE.Vector3().subVectors(b,a),mesh=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,d.length(),radial),material);mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);return mesh}
for(let i=0;i<=20;i++){const u=.025+i*.047;if(u>.975)continue;if(u>funnelStartU-.025&&u<funnelEndU+.025)continue;const f=frameAt(u);const groundY=.015;const top=f.p.clone().add(new THREE.Vector3(0,-.018,0));const foot=new THREE.Vector3(f.p.x,groundY,f.p.z);cylinderBetween(foot,top,.055,.04,woodMat,9);if(i%2===0){const left=top.clone().addScaledVector(f.side,-.3);const right=top.clone().addScaledVector(f.side,.3);cylinderBetween(left,right,.026,.026,stakeMat,8)}}


// A subtle stream enters the channel at the source.
const first=frameAt(0);const sourceTop=first.p.clone().add(new THREE.Vector3(-.12,.48,.15));
const sourceBamboo=new THREE.Mesh(new THREE.CylinderGeometry(.105,.12,.48,14,1,true),new THREE.MeshStandardMaterial({color:0x9da95e,map:bambooTexture,roughness:.34,side:THREE.DoubleSide}));sourceBamboo.position.copy(sourceTop).add(new THREE.Vector3(-.04,-.05,.02));sourceBamboo.rotation.z=-.35;sourceBamboo.castShadow=true;scene.add(sourceBamboo);


// A natural rounded-stone marble-race funnel, built as a real hollow bowl with an open drain.
// The water enters from the upper bamboo, follows the sloped inner wall, and can pass through the center opening.

function buildFluidChannelColliders(){
  // The solver accepts analytic box colliders, not a triangle-mesh collider, so
  // approximate each trough's *actual inner shell* with overlapping tiny boxes.
  // Each box follows the same tangent frame, radius, wall thickness and arc as
  // crossPos()/buildTroughSegment(). Its fluid-facing face is flush with the
  // visible inner bamboo surface; there are no oversized invisible side walls.
  const out=[];
  const COLLIDER_INTERVALS=96;
  const ARC_SEGMENTS=20;
  const OUTER_RADIUS=.247;
  const WALL_THICKNESS=.046;
  const INNER_RADIUS=OUTER_RADIUS-WALL_THICKNESS;
  const HALF_NORMAL=.027;
  const ARC_STEP=Math.PI*INNER_RADIUS/ARC_SEGMENTS;
  const halfArc=ARC_STEP*.5+.004;
  const lateralOverlap=.035;

  for(const [u0,u1] of intervalsOutsideFunnel(COLLIDER_INTERVALS)){
    const um=(u0+u1)*.5;
    const frame=frameAt(um);
    const p0=path.getPointAt(u0),p1=path.getPointAt(u1);
    const halfLength=p0.distanceTo(p1)*.5+lateralOverlap;
    const tangent=frame.t;
    for(let j=0;j<ARC_SEGMENTS;j++){
      const theta=-Math.PI/2+(j+.5)*Math.PI/ARC_SEGMENTS;
      const sin=Math.sin(theta),cos=Math.cos(theta);
      const arcTangent=frame.side.clone().multiplyScalar(cos).addScaledVector(frame.up,sin).normalize();
      const normal=frame.side.clone().multiplyScalar(-sin).addScaledVector(frame.up,cos).normalize();
      const surface=frame.p.clone()
        .addScaledVector(frame.side,INNER_RADIUS*sin)
        .addScaledVector(frame.up,WALL_THICKNESS+INNER_RADIUS*(1-cos));
      // The box's positive-normal face sits directly on the rendered inner wall;
      // the remainder of the collider is buried inside the bamboo material.
      const center=surface.clone().addScaledVector(normal,-HALF_NORMAL);
      const basis=new THREE.Matrix4().makeBasis(tangent,normal,arcTangent);
      const q=new THREE.Quaternion().setFromRotationMatrix(basis);
      out.push({
        type:'box',position:center.toArray(),rotation:[q.x,q.y,q.z,q.w],
        size:[halfLength*2,HALF_NORMAL*2,halfArc*2],friction:.0045
      });
    }
  }
  return out;
}

const vaseInteriorProfile=[[.115,.205],[.175,.31],[.34,.385],[.52,.402],[.71,.385],[.89,.345],[1.045,.275],[1.155,.218],[1.30,.218]];

  const localY=y/VASE_SCALE_Y;
  if(localY<=vaseInteriorProfile[0][0])return vaseInteriorProfile[0][1]*VASE_SCALE;

}

function buildVaseColliders(){

      );
    }

    f.bloom.rotation.y=Math.sin(t*.35+i)*.025;
  }

  if(!freeMode){
    const u=progress,f=frameAt(u);
    const look=f.p.clone().addScaledVector(f.t,2.0).add(new THREE.Vector3(0,.45,0));
    const desired=f.p.clone().addScaledVector(f.t,-3.25).addScaledVector(f.side,2.15).add(new THREE.Vector3(0,2.05,0));
    if(progress>.86){const blend=smooth((progress-.86)/.14);desired.lerp(new THREE.Vector3(vaseX+2.8,3.25,vaseZ+5.25),blend);look.lerp(new THREE.Vector3(vaseX,1.25,vaseZ),blend)}
    const cameraEase=progress>.86?1-Math.exp(-dt*1.15):1-Math.exp(-dt*(progress<.1?1.25:1.9));camera.position.lerp(desired,cameraEase);cameraTarget.lerp(look,1-Math.exp(-dt*(progress>.86?1.3:2.05)));camera.lookAt(cameraTarget);
    const arrivalIsSettled=physicalWaterReady&&progress>=.992&&camera.position.distanceTo(desired)<.22&&cameraTarget.distanceTo(look)<.22;
    cameraArrivalSettled=arrivalIsSettled?cameraArrivalSettled+dt:0;
    if(cameraArrivalSettled>=.75&&t>.5)enterFreeMode();
  }else{
    const direction=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));
    const forwardFlat=new THREE.Vector3(direction.x,0,direction.z).normalize();const right=new THREE.Vector3(-forwardFlat.z,0,forwardFlat.x);const intent=new THREE.Vector3();
    if(keys.w)intent.add(forwardFlat);if(keys.s)intent.sub(forwardFlat);if(keys.d)intent.add(right);if(keys.a)intent.sub(right);if(keys.e)intent.y+=1;if(keys.q)intent.y-=1;
    if(intent.lengthSq()>0)intent.normalize().multiplyScalar(moveSpeed*dt);camera.position.add(intent);camera.lookAt(camera.position.clone().add(direction));cameraTarget.copy(camera.position).add(direction);
  }
  const fillPct=Math.round(fillProgress*100);
  if(!physicalWaterError){
    if(!freeMode){$('bar').style.width=(progress*100).toFixed(1)+'%';$('eyebrow').textContent=physicalWaterReady?'FOLLOW THE REAL WATER':'LOADING 3D FLUID';$('status').textContent=!physicalWaterReady?'Loading the real-time 3D fluid solver…':progress<.12?'Water is emitted into the bamboo channel.':progress<.55?'The lightly silty stream winds through the open bamboo bends.':progress<.985?'Following the leading fluid particles toward the vase.':'The water has reached the vase.';$('detail').textContent=physicalWaterReady?'A naturally silty stream accelerates down the raised, precisely lined bamboo run and through the stone funnel.':'Preparing the water garden…';}
    else{$('bar').style.width=fillPct+'%';$('eyebrow').textContent=fillProgress<1?'THE VASE IS FILLING':'A GARDEN IN FULL BLOOM';$('status').textContent=fillProgress<1?`Real water accumulating in the vase · ${fillPct}%`:'The vase is full and the flowers have opened.';$('detail').textContent=fillProgress<1?'The vessel fills slowly while the blossoms open. Drag to look around and use WASD to explore.':'The garden is yours to explore.';$('phasePill').textContent=fillProgress<1?'02 / BLOOM':'03 / SERENITY'}
  }else{$('bar').style.width='0%';}
  if(physicalWaterReady)physicalWater.render(camera);else renderer.render(scene,camera);
}

animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
</script>
</body>
</html>
